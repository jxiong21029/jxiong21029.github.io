<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Patch size calculator</title>
    <style>
        :root {
            color-scheme: light;
            /* font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; */
            font-family: Arial, Helvetica, sans-serif;
            color: #202020;
            background-color: #EEEEEE;
            font-size: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        main {
            margin: auto;
            width: 100%;
            max-width: 46em;
            background-color: white;
            box-sizing: border-box;
            padding: 20px;
        }

        h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 22px;
            letter-spacing: -.3px;
        }

        form {
            margin: 0 0 20px;
        }

        label {
            display: grid;
            gap: 6px;
            min-width: 0;
            font-size: 12px;
            color: #505050;
        }

        input {
            font: inherit;
            color: #202020;
        }

        input[type="number"] {
            width: 100%;
            min-width: 0;
            height: 36px;
            border: 1px solid #cfcfcf;
            border-radius: 4px;
            padding: 6px 9px;
            background: #fff;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        input:hover {
            border-color: #949494;
        }

        input:focus-visible,
        .swap:focus-visible,
        .table-wrap:focus-visible {
            outline: 2px solid #454545;
            outline-offset: 3px;
        }

        .primary-fields {
            display: grid;
            /* The target pair gets extra room for its longer labels. */
            grid-template-columns: repeat(2, minmax(0, 2fr)) repeat(2, minmax(0, 3fr));
            gap: 16px;
        }

        .target-fields {
            grid-column: span 2;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        }

        /* Sits between the two labels, centered on their line of text. */
        .swap {
            align-self: start;
            display: grid;
            place-items: center;
            width: 32px;
            height: 20px;
            margin-top: -3px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: none;
            color: #717171;
            cursor: pointer;
        }

        .swap:hover {
            color: #202020;
            background: #f2f2f2;
        }

        .table-wrap {
            overflow-x: auto;
            overscroll-behavior-x: contain;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            /* Sum of the <col> widths, so narrow screens scroll instead of squeezing columns. */
            min-width: 604px;
            white-space: nowrap;
            text-align: left;
        }

        th {
            font-size: 12px;
            font-weight: 500;
            color: #505050;
            background: #f7f7f7;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 10px 14px;
        }

        th small {
            display: block;
            font-size: 10px;
            font-weight: 400;
            margin-top: 3px;
            color: #717171;
        }

        td {
            border-bottom: 1px solid #e9e9e9;
            padding: 10px 14px;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-variant-numeric: tabular-nums;
        }

        th:first-child,
        td:first-child {
            padding-left: 12px;
            color: #777;
        }

        th:last-child,
        td:last-child {
            padding-right: 12px;
        }

        tbody .message {
            padding: 26px 12px;
            font-family: inherit;
            color: #666;
            text-align: center;
        }

        #results[aria-busy="true"] tbody {
            opacity: .4;
        }

        #error {
            font-size: 13px;
            margin: 0 0 14px;
            color: #a12828;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 700px) {
            main {
                padding: 20px 16px 32px;
            }

            .primary-fields {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            h1 {
                margin-bottom: 18px;
            }

            th,
            td {
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Patch size calculator</h1>
        <noscript>JavaScript is required.</noscript>
        <form id="settings-form" novalidate autocomplete="off">
            <div class="primary-fields">
                <label>height (px)<input id="height" name="height" type="number" value="720" min="1" max="65536"
                        step="1" inputmode="numeric" required></label>
                <label>width (px)<input id="width" name="width" type="number" value="1280" min="1" max="65536" step="1"
                        inputmode="numeric" required></label>
                <div class="target-fields">
                    <label data-target="tokens"># tokens EQUALS<input id="tokens" name="tokens" type="number"
                            value="960" min="1" max="262144" step="1" inputmode="numeric" required></label>
                    <label data-target="patch" hidden># tokens DIVISIBLE BY<input id="tokenMultiple"
                            name="tokenMultiple" type="number" value="64" min="1" max="262144" step="1"
                            inputmode="numeric" required></label>
                    <button id="swap" class="swap" type="button" title="Swap target and divisor"
                        aria-label="Swap target and divisor"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 5h11M10 2l3 3-3 3M14 11H3M6 8l-3 3 3 3" />
                        </svg></button>
                    <label data-target="tokens">patch size DIVISIBLE BY<input id="patchMultiple" name="patchMultiple"
                            type="number" value="8" min="1" max="512" step="1" inputmode="numeric" required></label>
                    <label data-target="patch" hidden>patch size EQUALS<input id="patchSize" name="patchSize"
                            type="number" value="16" min="1" max="4096" step="1" inputmode="numeric" required></label>
                </div>
            </div>
        </form>
        <section id="results" aria-label="Candidates" aria-busy="true">
            <p id="error" role="alert" hidden></p>
            <div class="table-wrap" tabindex="0" role="region" aria-label="Candidate shortlist">
                <table>
                    <!-- Fixed widths so columns don't shift when results change; they only grow for very long values. -->
                    <colgroup>
                        <col style="width: 44px">
                        <col style="width: 110px">
                        <col style="width: 170px">
                        <col style="width: 130px">
                        <col style="width: 150px">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Patch size<small>H × W (px)</small></th>
                            <th scope="col">Token grid<small>h × w = total</small></th>
                            <th scope="col">Resized<small>H × W (px)</small></th>
                            <th scope="col">Resize<small>ΔH/H, ΔW/W</small></th>
                        </tr>
                    </thead>
                    <tbody id="candidate-rows">
                        <tr>
                            <td colspan="5" class="message">Calculating…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script id="patch-engine">
        (function (root) {
            'use strict';
            const EPS = 1e-11;
            const MAX_PATCH = 512, COUNT = 20;
            const weights = Object.freeze({ resize: 4, aspect: 2, square: 1 });
            const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
            const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
            const defaults = Object.freeze({
                target: 'tokens', height: 720, width: 1280,
                tokens: 960, patchMultiple: 8, patchSize: 16, tokenMultiple: 64
            });
            const limits = {
                height: [1, 65536, 'Source height'],
                width: [1, 65536, 'Source width'],
                tokens: [1, 262144, 'Target token count'],
                patchMultiple: [1, MAX_PATCH, 'Patch-side divisor'],
                patchSize: [1, 4096, 'Target patch size'],
                tokenMultiple: [1, 262144, 'Token-count divisor']
            };
            const activeKeys = { tokens: ['tokens', 'patchMultiple'], patch: ['patchSize', 'tokenMultiple'] };

            function validate(options) {
                const s = { ...defaults, ...options };
                // Ignore obsolete or unknown settings when migrating an older saved setup.
                for (const key of Object.keys(s)) {
                    if (!Object.prototype.hasOwnProperty.call(defaults, key)) delete s[key];
                }
                if (!Object.prototype.hasOwnProperty.call(activeKeys, s.target))
                    throw new Error('Target must be "tokens" or "patch".');
                // Only the fields for the active target are shown, so only those are checked.
                for (const key of ['height', 'width', ...activeKeys[s.target]]) {
                    const [lo, hi, label] = limits[key];
                    if (!Number.isSafeInteger(s[key]) || s[key] < lo || s[key] > hi)
                        throw new Error(`${label} must be a whole number from ${lo.toLocaleString('en-US')} to ${hi.toLocaleString('en-US')}.`);
                }
                return s;
            }

            // Ascending desirability loss, with deterministic tie-breakers. Raw loss is
            // used for ordering even when penalties round to the same number.
            function compare(a, b) {
                return a.loss - b.loss || a.resizePenalty - b.resizePenalty || a.squarePenalty - b.squarePenalty ||
                    a.gridH - b.gridH || a.gridW - b.gridW || a.patchH - b.patchH || a.patchW - b.patchW;
            }

            class TopK {
                constructor(k) { this.k = k; this.items = []; }
                cutoff() { return this.items.length < this.k ? Infinity : this.items[0].loss; }
                add(value) {
                    const a = this.items;
                    if (a.length < this.k) {
                        a.push(value);
                        let i = a.length - 1;
                        while (i > 0) {
                            const p = (i - 1) >> 1;
                            if (compare(a[i], a[p]) <= 0) break;
                            [a[i], a[p]] = [a[p], a[i]]; i = p;
                        }
                    } else if (compare(value, a[0]) < 0) {
                        a[0] = value;
                        let i = 0;
                        for (; ;) {
                            let worst = i, l = i * 2 + 1, r = l + 1;
                            if (l < a.length && compare(a[l], a[worst]) > 0) worst = l;
                            if (r < a.length && compare(a[r], a[worst]) > 0) worst = r;
                            if (worst === i) break;
                            [a[i], a[worst]] = [a[worst], a[i]]; i = worst;
                        }
                    }
                }
                sorted() { return this.items.slice().sort(compare); }
            }

            function penalties(s, gh, gw, ph, pw) {
                const a = Math.log(gh * ph / s.height), b = Math.log(gw * pw / s.width), q = Math.log(ph / pw);
                const resizePenalty = weights.resize * (a * a + b * b) / 2;
                const aspectPenalty = weights.aspect * (a - b) ** 2;
                const squarePenalty = weights.square * q * q;
                const loss = resizePenalty + aspectPenalty + squarePenalty;
                return { loss, resizePenalty, aspectPenalty, squarePenalty };
            }

            function candidate(s, gh, gw, ph, pw) {
                return {
                    gridH: gh, gridW: gw, patchH: ph, patchW: pw,
                    resizedH: gh * ph, resizedW: gw * pw, tokens: gh * gw,
                    scaleH: gh * ph / s.height, scaleW: gw * pw / s.width,
                    ...penalties(s, gh, gw, ph, pw)
                };
            }

            function prepareGrid(s, gh, gw, logs) {
                // Align both axes to multiples of the same divisor before searching.
                const step = s.patchMultiple;
                const lo = step, hi = Math.floor(MAX_PATCH / step) * step;
                const a = Math.log(gh / s.height), b = Math.log(gw / s.width);
                const { resize: R, aspect: D, square: S } = weights;
                const A = R / 2 + D + S, C = D + S;
                const d1 = -R * a / 2 - D * (a - b);
                const d2 = -R * b / 2 + D * (a - b);
                const ul = logs[lo], uh = logs[hi];
                const lossAt = (u, v) => {
                    const x = u + a, y = v + b;
                    return R * (x * x + y * y) / 2 + D * (x - y) ** 2 + S * (u - v) ** 2;
                };
                const vAt = u => clamp((C * u + d2) / A, ul, uh);
                const uAt = v => clamp((C * v + d1) / A, ul, uh);
                const det = (A - C) * (A + C);
                const u0 = (A * d1 + C * d2) / det;
                const v0 = (C * d1 + A * d2) / det;
                const points = [[ul, vAt(ul)], [uh, vAt(uh)], [uAt(ul), ul], [uAt(uh), uh]];
                if (u0 >= ul && u0 <= uh && v0 >= ul && v0 <= uh) points.push([u0, v0]);
                let best = { lowerBound: Infinity, optU: ul };
                for (const [u, v] of points) {
                    const loss = lossAt(u, v);
                    if (loss < best.lowerBound) best = { lowerBound: loss, optU: u };
                }
                return { gh, gw, lo, hi, step, lossAt, vAt, ...best };
            }

            /**
             * Exact top-K search over patch sizes for a fixed token count. Each token
             * grid (gh × gw = tokens) has a strictly convex quadratic loss in log(patch H)
             * and log(patch W). Its continuous minimum is a lower bound. We visit only
             * multiples of patchMultiple, outward from the continuous minima on each axis.
             */
            function searchByTokens(s) {
                const logs = new Float64Array(MAX_PATCH + 1);
                for (let i = 1; i <= MAX_PATCH; i++) logs[i] = Math.log(i);
                const grids = [];
                for (let h = 1; h * h <= s.tokens; h++) {
                    if (s.tokens % h) continue;
                    const w = s.tokens / h;
                    for (const [gh, gw] of h === w ? [[h, w]] : [[h, w], [w, h]]) grids.push(prepareGrid(s, gh, gw, logs));
                }
                grids.sort((a, b) => a.lowerBound - b.lowerBound || a.gh - b.gh || a.gw - b.gw);
                const top = new TopK(COUNT);
                for (const g of grids) {
                    if (g.lowerBound > top.cutoff() + EPS) break;
                    const { lo, hi, step } = g;
                    const floorSide = value => clamp(Math.floor(value / step) * step, lo - step, hi);
                    let left = floorSide(Math.exp(g.optU)), right = left + step;
                    const row = ph => {
                        if (ph < lo || ph > hi) return { loss: Infinity };
                        const u = logs[ph], v = g.vAt(u);
                        return { ph, u, v, loss: g.lossAt(u, v) };
                    };
                    let lr = row(left), rr = row(right);
                    while (left >= lo || right <= hi) {
                        const takeLeft = lr.loss <= rr.loss;
                        const r = takeLeft ? lr : rr;
                        if (!Number.isFinite(r.loss) || r.loss > top.cutoff() + EPS) break;
                        let wl = floorSide(Math.exp(r.v)), wr = wl + step;
                        const col = pw => pw < lo || pw > hi ? null : candidate(s, g.gh, g.gw, r.ph, pw);
                        let lc = col(wl), rc = col(wr);
                        while (lc || rc) {
                            const useLeft = lc && (!rc || compare(lc, rc) <= 0);
                            const c = useLeft ? lc : rc;
                            if (c.loss > top.cutoff() + EPS) break;
                            top.add(c);
                            if (useLeft) { wl -= step; lc = col(wl); }
                            else { wr += step; rc = col(wr); }
                        }
                        if (takeLeft) { left -= step; lr = row(left); }
                        else { right += step; rr = row(right); }
                    }
                }
                return top.sorted();
            }

            /**
             * Exact top-K search over token grids for a fixed square patch size. The loss
             * is convex in (log gh, log gw), so each grid height's continuous minimum over
             * log gw is a lower bound that grows outward from gh = height / patchSize.
             * Within a row, gh × gw is divisible by tokenMultiple exactly when gw is a
             * multiple of tokenMultiple / gcd(gh, tokenMultiple).
             */
            function searchByPatch(s) {
                const P = s.patchSize, N = s.tokenMultiple;
                const { resize: R, aspect: D } = weights;
                const alpha = Math.log(P / s.height), beta = Math.log(P / s.width);
                const row = gh => {
                    if (gh < 1) return { loss: Infinity };
                    const a = Math.log(gh) + alpha, b = 2 * D * a / (R + 2 * D);
                    return { gh, gw: Math.exp(b - beta), loss: R * (a * a + b * b) / 2 + D * (a - b) ** 2 };
                };
                const top = new TopK(COUNT);
                let left = Math.floor(s.height / P), right = left + 1;
                let lr = row(left), rr = row(right);
                for (; ;) {
                    const takeLeft = lr.loss <= rr.loss;
                    const r = takeLeft ? lr : rr;
                    if (!Number.isFinite(r.loss) || r.loss > top.cutoff() + EPS) break;
                    const step = N / gcd(r.gh, N);
                    let wl = Math.floor(r.gw / step) * step, wr = wl + step;
                    const col = gw => gw < 1 ? null : candidate(s, r.gh, gw, P, P);
                    let lc = col(wl), rc = col(wr);
                    while (lc || rc) {
                        const useLeft = lc && (!rc || compare(lc, rc) <= 0);
                        const c = useLeft ? lc : rc;
                        if (c.loss > top.cutoff() + EPS) break;
                        top.add(c);
                        if (useLeft) { wl -= step; lc = col(wl); }
                        else { wr += step; rc = col(wr); }
                    }
                    if (takeLeft) { left--; lr = row(left); }
                    else { right++; rr = row(right); }
                }
                return top.sorted();
            }

            function search(options) {
                const s = validate(options);
                return { settings: s, candidates: s.target === 'tokens' ? searchByTokens(s) : searchByPatch(s) };
            }
            const api = { defaults, validate, search, compare, penalties };
            if (typeof module !== 'undefined' && module.exports) module.exports = api;
            root.PatchEngine = api;
        })(typeof self !== 'undefined' ? self : globalThis);

    </script>
    <script>
        (function () {
            'use strict';
            const $ = id => document.getElementById(id);
            const fmt = n => new Intl.NumberFormat('en-US').format(n);
            const shape = (h, w) => `${fmt(h)} × ${fmt(w)}`;
            const numericKeys = ['height', 'width', 'tokens', 'patchMultiple', 'patchSize', 'tokenMultiple'];
            const storageKey = 'patch-lab-settings-v2';
            let worker = null, workerURL = null, timer = null, requestId = 0, lastSettings = null;
            let target = 'tokens';

            function percent(scale) {
                if (scale === 1) return '0%';
                const n = (scale - 1) * 100;
                const sign = n > 0 ? '+' : '−';
                return Math.abs(n) < .05 ? `${sign}<0.1%` : `${sign}${fmt(Number(Math.abs(n).toFixed(1)))}%`;
            }

            function readForm() {
                const s = { target };
                for (const key of numericKeys) s[key] = $(key).value.trim() === '' ? NaN : Number($(key).value);
                return PatchEngine.validate(s);
            }

            function showTarget() {
                $('settings-form').querySelectorAll('[data-target]').forEach(label => {
                    label.hidden = label.dataset.target !== target;
                });
            }

            function setForm(s) {
                for (const key of numericKeys) $(key).value = s[key];
                target = s.target;
                showTarget();
            }

            function message(text) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 5;
                cell.className = 'message';
                cell.textContent = text;
                row.appendChild(cell);
                $('candidate-rows').replaceChildren(row);
            }

            function fail(text) {
                lastSettings = null;
                $('results').setAttribute('aria-busy', 'false');
                $('error').textContent = text;
                $('error').hidden = false;
                $('candidate-rows').replaceChildren();
                $('status').textContent = '';
            }

            function finish(result) {
                $('results').setAttribute('aria-busy', 'false');
                $('error').hidden = true;
                const fragment = document.createDocumentFragment();
                result.candidates.forEach((c, index) => {
                    const row = document.createElement('tr');
                    const values = [index + 1, shape(c.patchH, c.patchW), `${shape(c.gridH, c.gridW)} = ${fmt(c.tokens)}`,
                    shape(c.resizedH, c.resizedW), `${percent(c.scaleH)}, ${percent(c.scaleW)}`];
                    for (const value of values) {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    }
                    fragment.appendChild(row);
                });
                $('candidate-rows').replaceChildren(fragment);
                if (!result.candidates.length) message('No candidates match these constraints.');
                $('status').textContent = `${result.candidates.length} candidates.`;
                try { localStorage.setItem(storageKey, JSON.stringify(result.settings)); }
                catch (_) { /* Local-file storage can be unavailable. */ }
            }

            function runInPage(id, settings) {
                setTimeout(() => {
                    if (id !== requestId) return;
                    try {
                        const result = PatchEngine.search(settings);
                        if (id === requestId) finish(result);
                    } catch (e) { if (id === requestId) fail(e.message); }
                }, 0);
            }

            function stopWorker() {
                if (worker) worker.terminate();
                worker = null;
                if (workerURL) URL.revokeObjectURL(workerURL);
                workerURL = null;
            }

            function makeWorker() {
                try {
                    if (!window.Worker) return;
                    const src = $('patch-engine').textContent + `
        self.onmessage = ({ data: { id, settings } }) => {
          try { self.postMessage({ id, result: PatchEngine.search(settings) }); }
          catch (e) { self.postMessage({ id, error: e.message }); }
        };`;
                    workerURL = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
                    worker = new Worker(workerURL);
                    worker.onmessage = ({ data }) => {
                        if (data.id !== requestId) return;
                        if (data.error) fail(data.error); else finish(data.result);
                    };
                    worker.onerror = event => {
                        event.preventDefault();
                        stopWorker();
                        if (lastSettings) runInPage(requestId, lastSettings);
                    };
                } catch (_) { stopWorker(); }
            }

            function run() {
                clearTimeout(timer);
                const id = ++requestId;
                let settings;
                try { settings = readForm(); }
                catch (e) { fail(e.message); return; }
                lastSettings = settings;
                $('error').hidden = true;
                $('results').setAttribute('aria-busy', 'true');
                $('status').textContent = 'Calculating…';
                if (worker) {
                    try { worker.postMessage({ id, settings }); }
                    catch (_) { stopWorker(); runInPage(id, settings); }
                } else runInPage(id, settings);
            }

            function schedule() {
                clearTimeout(timer);
                // Invalidate older results immediately, including worker fallback work.
                requestId++;
                lastSettings = null;
                $('error').hidden = true;
                $('results').setAttribute('aria-busy', 'true');
                $('status').textContent = 'Calculating…';
                timer = setTimeout(run, 160);
            }

            $('settings-form').addEventListener('input', schedule);
            $('settings-form').addEventListener('change', schedule);
            $('settings-form').addEventListener('submit', event => { event.preventDefault(); run(); });
            $('settings-form').addEventListener('keydown', event => {
                if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
                    event.preventDefault(); run();
                }
            });
            $('swap').addEventListener('click', () => {
                target = target === 'tokens' ? 'patch' : 'tokens';
                showTarget();
                run();
            });
            window.addEventListener('pagehide', stopWorker);

            // Restore saved values one field at a time, so an invalid or missing value
            // (such as one left blank in the hidden pair) falls back to its default.
            const initial = { ...PatchEngine.defaults };
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey));
                if (saved) {
                    for (const key of numericKeys) {
                        const value = saved[key], el = $(key);
                        if (Number.isSafeInteger(value) && value >= Number(el.min) && value <= Number(el.max))
                            initial[key] = value;
                    }
                    if (saved.target === 'patch') initial.target = 'patch';
                }
            } catch (_) { }
            setForm(initial);
            makeWorker();
            run();
        })();
    </script>
</body>

</html>
